spring.main.application-startup=buffering
#spring.mvc.log-request-details=true
#server.tomcat.accesslog.enabled=true


# Core container and bean creation
logging.level.org.springframework.context=DEBUG
logging.level.org.springframework.context.annotation=DEBUG
 # (processing @Configuration, @Bean, @Import)
logging.level.org.springframework.beans.factory.support=TRACE
  # (bean creation, dependency resolution)
logging.level.org.springframework.beans.factory.annotation=DEBUG
  # (@Autowired/@Value processing)
logging.level.org.springframework.aop=DEBUG
  # (proxy creation)
logging.level.org.springframework.transaction=DEBUG
  # (@Transactional boundaries)

#Auto?configuration and conditions (Boot)

debug=true 
   #(prints auto-config condition report at startup)
logging.level.org.springframework.boot.autoconfigure.condition=DEBUG

#Embedded web server and web app context
logging.level.org.springframework.boot.web.servlet.context=DEBUG
  # (ServletWebServerApplicationContext lifecycle)
logging.level.org.springframework.boot.web.embedded.tomcat=DEBUG
  # (Tomcat creation/port binding; use jetty/undertow packages as needed)
logging.level.org.apache.catalina=INFO 
  # (Tomcat internals; raise to DEBUG for more)

#DispatcherServlet and MVC routing
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=TRACE
  # (request lifecycle, handler/view resolution)
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
  # (endpoint mapping on startup)
logging.level.org.springframework.web.servlet.mvc.method.annotation.ServletInvocableHandlerMethod=DEBUG
  # (method invocation)
logging.level.org.springframework.http.converter=DEBUG
  # (HttpMessageConverters: serialize/deserialize)
logging.level.org.springframework.web.servlet.view=DEBUG
  # (View resolution)

#Static resources and resource handling
logging.level.org.springframework.web.servlet.resource=DEBUG

#Optional (security, data, etc.)
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
   # (SQL + bind params)

#Request/response details and access logs
spring.mvc.log-request-details=true
 #(adds headers/params to framework logs)
server.tomcat.accesslog.enabled=true
  #(HTTP access log; use undertow/jetty equivalents)