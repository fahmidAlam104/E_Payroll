spring.application.name=EmployeePayrollManagement
server.port=8081
spring.mazak=hello
#add any base url that we want our dispatcher servlet to use to recognize that the req is for him(deafult / )
server.servlet.context-path=/

# MySQL Configuration
# the address of my datasource
spring.datasource.url=jdbc:mysql://localhost:3306/newDb
spring.datasource.username=root
spring.datasource.password=Fahmid@1
#  driver that we will use to interact with db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
# the old db will be updated
spring.jpa.hibernate.ddl-auto=update
# query in terminal
spring.jpa.show-sql=true
# type of db used in hibernate so that uske lang mai transalte
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

rootLogger.level =INFO

appender.console.type = Console
appender.console,name = Fahmid
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

rootLogger.appenderRef.stdout.ref=Fahmid




